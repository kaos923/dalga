name: DALGA exe
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller keyboard
      - run: pyinstaller --noconfirm --clean --onefile --noconsole --name DALGA --hidden-import apex_hid dalga.py
      - uses: actions/upload-artifact@v4
        with:
          name: DALGA-exe
          path: dist/DALGA.exe
